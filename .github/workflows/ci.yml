# One workflow per commit — HandyGo Tenant Mobile.
#
# pull_request / workflow_call (release tags): quality gate only.
# push to main: quality gate, then queue EAS iOS → TestFlight and Android → Play Internal.
#
# EAS is configured (eas.json production + submit). Builds are queued with --no-wait;
# Expo/Apple/Google do the rest. Store production still requires a v* tag (release.yml).
#
# Secrets: EXPO_TOKEN, ASC_API_KEY_BASE64, GOOGLE_SERVICE_ACCOUNT_KEY,
#          GOOGLE_SERVICES_JSON_BASE64, ASC_DEMO_PASSWORD

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate translation parity
        run: npm run check:i18n

      - name: Validate store metadata
        env:
          # Demo password is gitignored; CI supplies it so the listing check
          # can verify App Review credentials are complete.
          ASC_DEMO_PASSWORD: ${{ secrets.ASC_DEMO_PASSWORD }}
        run: npm run check:metadata

      - name: Validate Play listing metadata
        run: npm run check:play-metadata

  eas-ios:
    name: EAS iOS → TestFlight
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install dependencies
        run: npm ci

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          KEY_ID="${{ vars.ASC_KEY_ID || 'A945G7BMSZ' }}"
          mkdir -p secrets
          echo "$ASC_API_KEY_BASE64" | base64 -d > "secrets/AuthKey_${KEY_ID}.p8"
          chmod 600 "secrets/AuthKey_${KEY_ID}.p8"

      - name: Queue EAS iOS build + TestFlight submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Prefer local ASC key from secrets/ over incomplete EAS-hosted key
          # (remote key prompts for Apple Team ID and breaks --non-interactive).
          EXPO_ASC_API_KEY_PATH: ./secrets/AuthKey_${{ vars.ASC_KEY_ID || 'A945G7BMSZ' }}.p8
          EXPO_ASC_KEY_ID: ${{ vars.ASC_KEY_ID || 'A945G7BMSZ' }}
          EXPO_ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID || '73d61e3d-d8c6-4a29-af54-9b71dcbcb92b' }}
          EXPO_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'NM4ZT8W7HH' }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          EXPO_APPLE_ID: jawadarifpro@gmail.com
        run: |
          eas build \
            --platform ios \
            --profile production \
            --non-interactive \
            --auto-submit \
            --no-wait

  eas-android:
    name: EAS Android → Play Internal
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install dependencies
        run: npm ci

      - name: Write Play service account key
        id: play_key
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::notice::GOOGLE_SERVICE_ACCOUNT_KEY unset — skipping Play Internal"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p secrets
          echo "$GOOGLE_SERVICE_ACCOUNT_KEY" | base64 -d > secrets/google-play-key.json
          chmod 600 secrets/google-play-key.json
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Write google-services.json
        if: steps.play_key.outputs.skip != 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set — Android push may fail"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          chmod 600 google-services.json

      - name: Queue EAS Android build + Play Internal submit
        if: steps.play_key.outputs.skip != 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Prefer local ASC key from secrets/ over incomplete EAS-hosted key
          # (remote key prompts for Apple Team ID and breaks --non-interactive).
          EXPO_ASC_API_KEY_PATH: ./secrets/AuthKey_${{ vars.ASC_KEY_ID || 'A945G7BMSZ' }}.p8
          EXPO_ASC_KEY_ID: ${{ vars.ASC_KEY_ID || 'A945G7BMSZ' }}
          EXPO_ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID || '73d61e3d-d8c6-4a29-af54-9b71dcbcb92b' }}
          EXPO_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'NM4ZT8W7HH' }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          EXPO_APPLE_ID: jawadarifpro@gmail.com
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --auto-submit \
            --no-wait
