# Quality gate for HandyGo Tenant Mobile.
#
# Runs on every pull request and on pushes to main. The release workflows depend
# on this job, so nothing reaches TestFlight, Play Internal, or the stores without
# passing.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate translation parity
        run: npm run check:i18n

      - name: Validate store metadata
        env:
          # Demo password is gitignored; CI supplies it so the listing check
          # can verify App Review credentials are complete.
          ASC_DEMO_PASSWORD: ${{ secrets.ASC_DEMO_PASSWORD }}
        run: npm run check:metadata

      - name: Validate Play listing metadata
        run: npm run check:play-metadata
