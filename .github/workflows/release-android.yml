# Production Android release: git tag v1.2.3 -> Play production draft.
#
# Tagging freezes the candidate. main continues to ship Internal testing via
# eas-play-internal.yml. This workflow uploads an AAB to the Play production
# track as a draft — it does not go live. Promote with submit-play.yml or the
# Play Console UI after listing / Data safety are complete.
#
# Required secrets: EXPO_TOKEN, GOOGLE_SERVICE_ACCOUNT_KEY
# Optional: GOOGLE_SERVICES_JSON_BASE64

name: Release - Play Store

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version, e.g. 1.0.0'
        required: true
        type: string

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Quality gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: EAS Android production draft
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing Android $VERSION"

      - name: Check tag matches app.json version
        run: |
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          if [ "$APP_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag version ${{ steps.version.outputs.version }} does not match app.json version $APP_VERSION"
            exit 1
          fi

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install dependencies
        run: npm ci

      - name: Write Play service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_KEY secret is empty"
            exit 1
          fi
          mkdir -p secrets
          echo "$GOOGLE_SERVICE_ACCOUNT_KEY" | base64 -d > secrets/google-play-key.json
          chmod 600 secrets/google-play-key.json

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 not set — Android push may fail"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > google-services.json
          chmod 600 google-services.json

      - name: EAS build and submit production draft
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build \
            --platform android \
            --profile production \
            --non-interactive \
            --auto-submit-with-profile production-store \
            --no-wait

      - name: Next steps
        run: |
          echo "AAB queued for Play production track as draft."
          echo "Complete listing + Data safety in Play Console, then run"
          echo "'Submit - Play Store' (or promote the draft in Console) to go live."
