# Run the readiness audit and submit the prepared version to App Review.
#
# Split out from release.yml because EAS builds plus Apple's binary processing
# take hours. Run this once the build appears in App Store Connect.
#
# The audit runs first and fails the job on any outstanding blocker, so a
# submission never sits in Apple's queue for a day only to bounce on something
# we could have detected in seconds.

name: Submit for App Review

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number to submit (blank = latest processed build)'
        required: false
        type: string
      audit_only:
        description: 'Run the readiness audit without submitting'
        required: false
        default: false
        type: boolean

jobs:
  submit:
    name: Audit and submit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID || 'A945G7BMSZ' }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID || '73d61e3d-d8c6-4a29-af54-9b71dcbcb92b' }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID || '6770624503' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Write the .p8 to a file instead of GITHUB_ENV — multiline PEM breaks
      # the <<EOF env delimiter ("Matching delimiter not found 'EOF'").
      - name: Decode App Store Connect key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          if [ -z "$ASC_API_KEY_BASE64" ]; then
            echo "::error::ASC_API_KEY_BASE64 secret is empty"
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_API_KEY_BASE64" | base64 -d > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_PRIVATE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Readiness audit
        run: node scripts/asc/audit.js

      - name: Submit for review
        if: ${{ github.event.inputs.audit_only != 'true' }}
        run: |
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            node scripts/asc/submit-for-review.js --build-number "${{ github.event.inputs.build_number }}"
          else
            node scripts/asc/submit-for-review.js
          fi
