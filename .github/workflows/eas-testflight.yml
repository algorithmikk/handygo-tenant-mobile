# Beta channel: main -> TestFlight.
#
# Every push to main that touches app code produces a build for internal
# testers. This is the soak stage; production releases are cut separately by
# tagging a version, which triggers release.yml.
#
# Required GitHub Actions secrets:
#   EXPO_TOKEN         - https://expo.dev/accounts/jaw_ari/settings/access-tokens
#   ASC_API_KEY_BASE64 - base64 of the App Store Connect .p8 key
#
# Free EAS plan: 15 iOS builds/month. Add [skip ci] to a commit message to skip.

name: Beta - TestFlight

# Manual only. Push to main is handled by ci.yml (one run: verify + EAS).
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'production'
        type: choice
        options: [preview, production]

# One build at a time. A second push while a build is queued waits, not cancels.
concurrency:
  group: eas-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Quality gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build-and-submit:
    name: EAS iOS -> TestFlight
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Install dependencies
        run: npm ci

      - name: Write App Store Connect API key
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          # eas.json submit.ios.ascApiKeyPath points here. Keep the key out of git
          # (secrets/ is gitignored) and only materialize it on the runner.
          KEY_ID="${{ vars.ASC_KEY_ID || 'A945G7BMSZ' }}"
          mkdir -p secrets
          echo "$ASC_API_KEY_BASE64" | base64 -d > "secrets/AuthKey_${KEY_ID}.p8"
          chmod 600 "secrets/AuthKey_${KEY_ID}.p8"

      - name: EAS build and auto-submit to TestFlight
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          # Prefer local ASC key from secrets/ over incomplete EAS-hosted key
          # (remote key prompts for Apple Team ID and breaks --non-interactive).
          EXPO_ASC_API_KEY_PATH: ./secrets/AuthKey_${{ vars.ASC_KEY_ID || 'A945G7BMSZ' }}.p8
          EXPO_ASC_KEY_ID: ${{ vars.ASC_KEY_ID || 'A945G7BMSZ' }}
          EXPO_ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID || '73d61e3d-d8c6-4a29-af54-9b71dcbcb92b' }}
          EXPO_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'NM4ZT8W7HH' }}
          EXPO_APPLE_TEAM_TYPE: INDIVIDUAL
          EXPO_APPLE_ID: jawadarifpro@gmail.com
        run: |
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          echo "Building profile: $PROFILE"
          eas build \
            --platform ios \
            --profile "$PROFILE" \
            --non-interactive \
            --auto-submit \
            --no-wait
